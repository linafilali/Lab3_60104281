name: AML Tumor Pipeline & Deployment

on:
  push:
    branches:
      - MLOp
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
  AZURE_ML_WORKSPACE:  ${{ secrets.AZURE_ML_WORKSPACE }}
  AZURE_TENANT_ID:     ${{ secrets.AZURE_TENANT_ID }}
  AZURE_CLIENT_ID:     ${{ secrets.AZURE_CLIENT_ID }}

jobs:
  run-pipeline-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Azure ML SDK + deps
        run: |
          python -m pip install --upgrade pip
          pip install azure-ai-ml azure-identity mlflow

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Submit training pipeline to Azure ML
        run: |
          python pipeline_job.py

      - name: Deploy latest registered model to Managed Online Endpoint
        if: success()
        run: |
          python deploy_endpoint.py
