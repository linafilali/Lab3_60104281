name: AML Tumor Pipeline & Deployment

on:
  push:
    branches:
      - MLOp
  workflow_dispatch: {}

env:
  AZURE_SUBSCRIPTION_ID: "a485bb50-61aa-4b2f-bc7f-b6b53539b9d3"
  AZURE_RESOURCE_GROUP: "rg-60104281"
  AZURE_ML_WORKSPACE:  "tumour60104281"


jobs:
  run-pipeline-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Azure ML SDK + deps
        run: |
          python -m pip install --upgrade pip
          pip install azure-ai-ml azure-identity mlflow

      - name: Azure login (service principal)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Submit training pipeline
        run: python pipeline_job.py

      - name: Deploy latest model
        if: success()
        run: python deploy_endpoint.py
